name: pokemon-tools
services:
  db:
    image: postgres:18
    container_name: pokemon-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pokemon_dev_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pokemon -d pokemon"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pokemon_dev_data:
